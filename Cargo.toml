[package]
name = "de-nox"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "A terminal disk-cleanup tool that knows the difference between a dead project and a busy one."
repository = "https://github.com/soul-abhi/De-Nox"
readme = "README.md"
keywords = ["cleanup", "disk", "tui", "node_modules", "build-artifacts"]
categories = ["command-line-utilities", "filesystem"]
# Keep the published crate limited to what `cargo install` actually needs.
# The repository keeps the documentation, scripts, and CI configuration.
exclude = [
  ".github/",
  "context.md",
  "dist-workspace.toml",
  "docs/",
  "rust-toolchain.toml",
  "scripts/",
]

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
nerd_fonts = "0.1.9"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
walkdir = "2.5.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
