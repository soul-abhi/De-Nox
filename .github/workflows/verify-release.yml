name: Verify release

# A release created with the workflow GITHUB_TOKEN does not emit a
# `release: published` event, so this workflow is chained off the Release
# workflow instead. It answers the question an empty assets list made
# embarrassingly easy to miss: are the files actually attached, checksummed,
# unpackable, and runnable?

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify, for example v0.1.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify published assets
    # The Release workflow also runs on pull requests. Only verify a successful
    # tag push, or an explicit manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}
        run: scripts/verify-release.sh "$TAG"
