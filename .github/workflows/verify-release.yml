name: Verify release

# Runs after the cargo-dist workflow publishes a release. It answers the
# question that an empty assets list made embarrassingly easy to miss:
# are the files actually attached, checksummed, unpackable, and runnable?

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify, for example v0.1.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify published assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: scripts/verify-release.sh "$TAG"
