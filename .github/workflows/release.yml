name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup cargo-dist
        uses: cargo-bins/cargo-binstall@main
        with:
          args: cargo-dist --locked

      - name: Run cargo-dist
        run: cargo dist --artifacts=tarball --targets=x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-unknown-linux-gnu
        env:
          CARGO_DIST_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_DIST_UPLOAD_RELEASES: true
          CARGO_DIST_RELEASE_BRANCH: main